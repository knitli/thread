[default]
locale = "en-us"
check-file = true
check-filename = true
extend-ignore-re = [
  "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
  "\\[\\d+;\\d+m",  # ANSI color codes (e.g., [38;5;231m)
  "\\[\\d+m",  # Simple ANSI codes (e.g., [0m)
]
extend-ignore-identifiers-re = [
  "iif",
  "iife",
  "i18n",
  "i18next",
  "i18n-t",
  "i18n-tc",
  "strat",
  "Inferrable",
  "mis",  # Appears in ANSI escape sequences like [38;5;231m
  "bare",
  "MISE",
  "prepend",
  "ret",
  "RET",
  "prev",
  "normalises",
  "goes",
]

[files]
ignore-hidden = false
ignore-files = true
extend-exclude = [
  "./CHANGELOG.md",
  "/usr/**/*",
  "/tmp/**/*",
  "/**/node_modules/**",
  "node_modules",
  "mkdocs-material",
  "license-list-data",
  "external",
  "vendor",
  ".git",
  "/usr/share/code/**/*",
  "eslint.config.mjs",
  "docs/manifest.json",
  "src/assets/videos/**/*",
  "src/assets/fonts/**/*",
  "src/assets/images/**/*",
  "**/claudedocs/**/*",  # Claude-generated docs may contain terminal output with ANSI codes
]

[type.md]
extend-ignore-re = [
  '(?s)(<!--)?\\s*spellchecker:off|(?s)(<!--)?\\s*spellchecker:off.*(<!--)?\\s*spellchecker:on',
]
