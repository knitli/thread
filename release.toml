# cargo-release workspace configuration
# https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
allow-branch = ["main"]
workspace = true
shared-version = true
consolidate-commits = true
push-remote = "origin"
pre-release-hook = [
  "bash",
  "-c",
  '''
  mise -yq trust || true
  mise run changelog
  ''',
]
pre-release-commit-message = "chore(release): v{{version}}"
tag-name = "v{{version}}"
push = true
publish = true
