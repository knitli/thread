# Swift language classification overrides
# Holdout evaluation: 67.6% overall → expected ~99% with overrides
# 112 items to override (83 unclassified + 29 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
attribute = "definition_data"
class_declaration = "definition_data"
dictionary_type = "definition_type"
existential_type = "definition_type"  # universal says syntax_punctuation
inheritance_constraint = "definition_type"
init_declaration = "definition_data"
lambda_function_type = "definition_type"
lambda_function_type_parameters = "definition_data"
protocol_body = "definition_type"
protocol_declaration = "definition_data"
protocol_function_declaration = "definition_type"
protocol_property_declaration = "definition_type"
protocol_property_requirements = "definition_type"
# --- Tier 3: Control Flow ---
pattern = "flow_branching"
switch_entry = "flow_branching"
switch_pattern = "flow_branching"
# --- Tier 4: Operations ---
additive_expression = "operation_operator"
bitwise_operation = "operation_operator"
check_expression = "operation_operator"
comparison_expression = "operation_operator"
conjunction_expression = "operation_operator"
constructor_expression = "operation_invocation"
didset_clause = "operation_invocation"
disjunction_expression = "operation_operator"
equality_expression = "operation_operator"
getter_specifier = "operation_invocation"
modify_specifier = "operation_invocation"
multiplicative_expression = "operation_operator"
parameter = "operation_data"
setter_specifier = "operation_invocation"
willset_clause = "operation_invocation"
# --- Tier 5: Syntax ---
array_literal = "syntax_literal"
associatedtype_declaration = "syntax_keyword"
availability_condition = "syntax_keyword"
call_suffix = "syntax_keyword"
capture_list = "syntax_punctuation"
