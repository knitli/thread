# Python language classification overrides
# Holdout evaluation: 79.5% overall → expected ~100% with overrides
# 43 items to override (25 unclassified + 18 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
class_definition = "definition_callable"  # universal says definition_type
decorator = "definition_callable"  # universal says syntax_annotation
# --- Tier 2: Boundaries ---
aliased_import = "boundary_module"
with_item = "boundary_resource"
# --- Tier 3: Control Flow ---
assert_statement = "flow_control"  # universal says flow_branching
case_pattern = "flow_branching"
class_pattern = "flow_branching"
complex_pattern = "flow_branching"
dict_pattern = "flow_branching"
dictionary_splat_pattern = "flow_branching"  # category says definition_data
for_in_clause = "flow_iteration"
import_statement = "flow_control"  # universal says flow_branching
list_splat_pattern = "flow_branching"  # category says definition_data
splat_pattern = "flow_branching"
union_pattern = "flow_branching"
with_clause = "flow_branching"
# --- Tier 4: Operations ---
augmented_assignment = "operation_operator"  # category says operation_data
dictionary_splat = "operation_operator"
set = "operation_operator"  # universal says syntax_keyword
splat_type = "operation_operator"
subscript = "operation_data"  # category says flow_branching
# --- Tier 5: Syntax ---
attribute = "syntax_annotation"  # category says flow_branching
chevron = "syntax_keyword"
constrained_type = "syntax_keyword"
dotted_name = "syntax_identifier"
except_clause = "syntax_keyword"
format_expression = "syntax_literal"
format_specifier = "syntax_annotation"
if_clause = "syntax_keyword"
keyword_argument = "syntax_punctuation"
lambda = "syntax_keyword"  # universal says expression_anonymous
member_type = "syntax_keyword"
parenthesized_list_splat = "syntax_keyword"
pattern_list = "syntax_punctuation"
relative_import = "syntax_keyword"
slice = "syntax_keyword"
string = "syntax_literal"  # category says operation_operator

[token_overrides]
# --- Tier 5: Syntax ---
"@" = "syntax_annotation"  # token_purpose says keyword
except = "syntax_annotation"  # token_purpose says keyword
finally = "syntax_annotation"  # token_purpose says keyword
line_continuation = "syntax_punctuation"  # token_purpose says keyword
try = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
