# Php language classification overrides
# Holdout evaluation: 84.4% overall → expected ~99% with overrides
# 46 items to override (31 unclassified + 15 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
array_element_initializer = "definition_data"
attribute = "definition_data"
base_clause = "definition_type"
class_declaration = "definition_data"  # category says flow_branching
enum_case = "definition_type"
function_static_declaration = "definition_data"  # category says flow_branching
global_declaration = "definition_data"  # category says flow_branching
namespace_use_declaration = "definition_data"  # category says flow_branching
property_element = "definition_data"
simple_parameter = "definition_data"
static_variable_declaration = "definition_data"
trait_declaration = "definition_data"  # category says flow_branching
variadic_parameter = "definition_data"
# --- Tier 2: Boundaries ---
namespace_use_clause = "boundary_module"
namespace_use_group = "boundary_module"
# --- Tier 3: Control Flow ---
default_statement = "flow_branching"
else_if_clause = "flow_branching"
# --- Tier 4: Operations ---
anonymous_class = "expression_anonymous"
anonymous_function_use_clause = "expression_anonymous"
cast_expression = "operation_operator"  # universal says definition_data
member_access_expression = "operation_operator"  # universal says syntax_identifier
variable_name = "operation_operator"  # universal says syntax_identifier
variadic_unpacking = "operation_operator"
# --- Tier 5: Syntax ---
argument = "syntax_punctuation"  # universal says syntax_keyword
attribute_group = "syntax_annotation"
by_ref = "syntax_keyword"
class_interface_clause = "syntax_keyword"
colon_block = "syntax_punctuation"
const_element = "syntax_keyword"
declare_directive = "syntax_keyword"
enum_declaration_list = "syntax_punctuation"
list_literal = "syntax_keyword"
match_condition_list = "syntax_punctuation"
nowdoc_body = "syntax_literal"
property_hook = "syntax_keyword"
property_hook_list = "syntax_punctuation"
property_promotion_parameter = "syntax_keyword"
sequence_expression = "syntax_literal"  # universal says syntax_identifier
string = "syntax_keyword"  # category says syntax_literal
text_interpolation = "syntax_identifier"
use_instead_of_clause = "syntax_keyword"
visibility_modifier = "syntax_annotation"

[token_overrides]
# --- Tier 5: Syntax ---
"@" = "syntax_annotation"  # token_purpose says keyword
finally = "syntax_annotation"  # token_purpose says keyword
try = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
