# Java language classification overrides
# Holdout evaluation: 78.9% overall → expected ~100% with overrides
# 54 items to override (41 unclassified + 13 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
annotation_type_element_declaration = "definition_data"
array_creation_expression = "definition_data"  # universal says operation_operator
array_initializer = "definition_data"
compact_constructor_declaration = "definition_data"
constant_declaration = "definition_data"
dimensions = "definition_type"
dimensions_expr = "definition_type"
element_value_array_initializer = "definition_data"
enhanced_for_statement = "definition_callable"  # category says flow_branching
enum_body_declarations = "definition_type"
enum_constant = "definition_callable"
extends_interfaces = "definition_type"
formal_parameter = "definition_data"
inferred_parameters = "definition_data"
local_variable_declaration = "definition_data"  # category says flow_branching
receiver_parameter = "definition_data"
resource = "definition_data"
static_initializer = "definition_data"
super_interfaces = "definition_type"
type_bound = "definition_type"
variable_declarator = "definition_data"
# --- Tier 2: Boundaries ---
catch_type = "boundary_error"
resource_specification = "boundary_resource"
# --- Tier 3: Control Flow ---
assert_statement = "flow_branching"  # universal says flow_control
catch_formal_parameter = "flow_branching"
guard = "flow_branching"
pattern = "flow_branching"
record_pattern = "flow_branching"
record_pattern_component = "flow_branching"
switch_block_statement_group = "flow_branching"
switch_label = "flow_branching"
switch_rule = "flow_branching"
# --- Tier 4: Operations ---
explicit_constructor_invocation = "operation_invocation"
field_access = "operation_data"  # category says operation_operator
method_invocation = "operation_invocation"  # category says operation_operator
spread_parameter = "operation_operator"
# --- Tier 5: Syntax ---
annotation = "syntax_annotation"
annotation_argument_list = "syntax_punctuation"
annotation_type_body = "syntax_punctuation"
class_body = "syntax_punctuation"
constructor_body = "syntax_punctuation"
element_value_pair = "syntax_annotation"
marker_annotation = "syntax_annotation"
module_body = "syntax_punctuation"
permits = "syntax_punctuation"
record_pattern_body = "syntax_punctuation"
string_interpolation = "syntax_literal"
wildcard = "syntax_keyword"  # universal says syntax_literal

[token_overrides]
# --- Tier 5: Syntax ---
"@" = "syntax_annotation"  # token_purpose says keyword
"@interface" = "syntax_annotation"  # token_purpose says keyword
finally = "syntax_annotation"  # token_purpose says keyword
try = "syntax_annotation"  # token_purpose says keyword
volatile = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
block_comment = true
