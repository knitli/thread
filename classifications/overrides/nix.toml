# Nix language classification overrides
# Holdout evaluation: 80.7% overall → expected ~100% with overrides
# 16 items to override (8 unclassified + 8 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
binding = "definition_data"  # universal says operation_data
binding_set = "definition_data"
# --- Tier 3: Control Flow ---
assert_expression = "flow_branching"  # category says operation_operator
if_expression = "flow_branching"  # category says operation_operator
# --- Tier 5: Syntax ---
attrpath = "syntax_identifier"
formal = "syntax_identifier"
formals = "syntax_identifier"
inherit = "syntax_keyword"
inherit_from = "syntax_identifier"
inherited_attrs = "syntax_identifier"
interpolation = "syntax_identifier"  # universal says syntax_literal
list_expression = "syntax_literal"  # category says operation_operator
source_code = "syntax_identifier"
string_expression = "syntax_literal"  # category says operation_operator

[token_overrides]
# --- Tier 5: Syntax ---
"@" = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
