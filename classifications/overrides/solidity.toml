# Solidity language classification overrides
# Holdout evaluation: 85.3% overall → expected ~100% with overrides
# 63 items to override (57 unclassified + 6 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
call_struct_argument = "definition_data"
constant_variable_declaration = "definition_data"
constructor_definition = "definition_data"
contract_declaration = "definition_data"
error_parameter = "definition_data"
event_parameter = "definition_data"
library_declaration = "definition_data"
modifier_definition = "definition_callable"
parameter = "definition_data"  # universal says operation_data
return_parameter = "definition_data"
state_variable_declaration = "definition_data"
struct_field_assignment = "definition_data"
struct_member = "definition_data"
variable_declaration_statement = "definition_data"
variable_declaration_tuple = "definition_data"
# --- Tier 2: Boundaries ---
import_directive = "boundary_module"
# --- Tier 4: Operations ---
member_expression = "operation_operator"  # universal says flow_branching
modifier_invocation = "operation_invocation"
payable_conversion_expression = "operation_operator"
slice_access = "operation_operator"
# --- Tier 5: Syntax ---
any_pragma_token = "syntax_keyword"
assembly_flags = "syntax_keyword"
assembly_statement = "syntax_annotation"
block_statement = "syntax_keyword"
call_argument = "syntax_punctuation"
contract_body = "syntax_punctuation"
emit_statement = "syntax_annotation"
error_declaration = "syntax_keyword"
event_definition = "syntax_keyword"
expression = "syntax_keyword"
fallback_receive_definition = "syntax_keyword"
inline_array_expression = "syntax_keyword"
layout_specifier = "syntax_annotation"
meta_type_expression = "syntax_keyword"
override_specifier = "syntax_annotation"
pragma_directive = "syntax_annotation"
return_type_definition = "syntax_keyword"
revert_arguments = "syntax_annotation"
revert_statement = "syntax_annotation"
solidity_pragma_token = "syntax_annotation"
statement = "syntax_keyword"
struct_body = "syntax_punctuation"
type_name = "syntax_keyword"
user_defined_type = "syntax_keyword"
user_defined_type_definition = "syntax_keyword"
using_alias = "syntax_keyword"
variable_declaration = "syntax_identifier"
yul_assignment = "syntax_keyword"
yul_block = "syntax_keyword"
yul_for_statement = "syntax_keyword"
yul_function_call = "syntax_keyword"
yul_function_definition = "syntax_keyword"
yul_identifier = "syntax_keyword"
yul_if_statement = "syntax_keyword"
yul_label = "syntax_keyword"
yul_path = "syntax_keyword"
yul_string_literal = "syntax_keyword"
yul_switch_statement = "syntax_keyword"
yul_variable_declaration = "syntax_keyword"

[token_overrides]
# --- Tier 5: Syntax ---
pragma = "syntax_annotation"  # token_purpose says keyword
staticcall = "syntax_annotation"  # token_purpose says keyword
try = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
