# Elixir language classification overrides
# Holdout evaluation: 84.3% overall → expected ~99% with overrides
# 20 items to override (15 unclassified + 5 misclassified)

[overrides]
# --- Tier 3: Control Flow ---
after_block = "flow_branching"
else_block = "flow_branching"
rescue_block = "flow_branching"
# --- Tier 4: Operations ---
access_call = "operation_operator"
call = "operation_invocation"
dot = "operation_operator"  # universal says syntax_punctuation
stab_clause = "operation_operator"
# --- Tier 5: Syntax ---
bitstring = "syntax_literal"
body = "syntax_literal"
charlist = "syntax_literal"
do_block = "syntax_punctuation"  # universal says flow_iteration
keywords = "syntax_literal"
map = "syntax_literal"  # universal says syntax_keyword
map_content = "syntax_literal"
quoted_atom = "syntax_literal"
quoted_keyword = "syntax_literal"
sigil = "syntax_literal"
string = "syntax_literal"

[token_overrides]
"@" = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
