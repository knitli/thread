# Haskell language classification overrides
# Holdout evaluation: 67.8% overall → expected ~100% with overrides
# 85 items to override (56 unclassified + 29 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
associated_type = "definition_type"  # universal says definition_data
binding_list = "definition_data"
children = "definition_data"
class_declarations = "definition_type"
constructor_synonym = "definition_type"
declarations = "definition_data"
equations = "definition_data"
explicit_type = "definition_type"
field = "definition_data"
field_path = "definition_type"
fields = "definition_data"
function = "definition_callable"  # universal says syntax_identifier
fundep = "definition_type"
fundeps = "definition_type"
gadt_constructor = "definition_type"
gadt_constructors = "definition_type"
header = "definition_data"
implicit_parameter = "definition_type"  # universal says syntax_punctuation
instance_declarations = "definition_type"
kind_application = "definition_type"
lazy_field = "definition_data"
local_binds = "definition_data"
match = "definition_data"  # universal says syntax_keyword
newtype_constructor = "definition_type"
prefix = "definition_data"  # universal says syntax_keyword
qualifiers = "definition_data"
quoted_decls = "definition_data"
strict_field = "definition_data"
type_application = "definition_type"
type_binder = "definition_type"
type_family_injectivity = "definition_type"
type_family_result = "definition_type"
type_instance = "definition_data"  # category says definition_type
unboxed_sum = "definition_type"  # category says operation_operator
unboxed_tuple = "definition_type"  # category says operation_operator
# --- Tier 2: Boundaries ---
exports = "boundary_module"  # universal says syntax_punctuation
import_list = "boundary_module"
import_name = "boundary_module"
module_export = "boundary_module"
# --- Tier 3: Control Flow ---
alternative = "flow_branching"
alternatives = "flow_branching"
boolean = "flow_branching"  # universal says syntax_keyword
do_module = "flow_iteration"
exp = "flow_branching"  # universal says syntax_punctuation
patterns = "flow_branching"
quoted_pattern = "flow_branching"
view_pattern = "flow_branching"
# --- Tier 4: Operations ---
apply = "operation_invocation"  # category says definition_type
bind = "operation_data"  # category says definition_callable
conditional = "operation_operator"  # universal says flow_branching
data_constructor = "operation_invocation"
data_constructors = "operation_invocation"
lambda = "expression_anonymous"  # category says operation_operator
quasiquote = "operation_operator"  # category says definition_type
splice = "operation_operator"  # category says definition_type
# --- Tier 5: Syntax ---
annotated = "syntax_keyword"
constructor_synonyms = "syntax_keyword"
deriving = "syntax_punctuation"
entity = "syntax_identifier"  # universal says syntax_literal
equation = "syntax_keyword"
field_name = "syntax_keyword"
field_update = "syntax_keyword"
forall = "syntax_punctuation"  # category says definition_type
function_head_parens = "syntax_keyword"
guards = "syntax_keyword"
inferred = "syntax_keyword"
infix_id = "syntax_keyword"
instance = "syntax_keyword"  # category says definition_data
newtype = "syntax_punctuation"  # category says definition_data
parens = "syntax_punctuation"  # category says definition_type
prefix_id = "syntax_identifier"  # category says definition_type
qualified = "syntax_punctuation"  # category says definition_type
quantified_variables = "syntax_keyword"
quoted_expression = "syntax_literal"
quoted_type = "syntax_literal"
quoter = "syntax_keyword"
record = "syntax_literal"  # universal says syntax_punctuation
special = "syntax_keyword"
type_params = "syntax_keyword"
type_patterns = "syntax_keyword"
via = "syntax_keyword"

[token_overrides]
# --- Tier 5: Syntax ---
"#" = "syntax_annotation"  # token_purpose says keyword
"@" = "syntax_annotation"  # token_purpose says keyword
pragma = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
