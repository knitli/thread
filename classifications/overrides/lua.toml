# Lua language classification overrides
# Holdout evaluation: 88.1% overall → expected ~100% with overrides
# 12 items to override (8 unclassified + 4 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
attribute = "definition_data"
field = "definition_data"
# --- Tier 3: Control Flow ---
else_statement = "flow_branching"
elseif_statement = "flow_branching"
for_generic_clause = "flow_iteration"
for_numeric_clause = "flow_iteration"
# --- Tier 4: Operations ---
method_index_expression = "operation_invocation"
# --- Tier 5: Syntax ---
string = "syntax_literal"  # category says operation_operator
variable_declaration = "syntax_identifier"  # category says definition_data
variable_list = "syntax_identifier"

[token_overrides]
# --- Tier 5: Syntax ---
"#" = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment_content = true
