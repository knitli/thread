# =============================================================================
# Thread/CodeWeaver Language Classification Override Format
# =============================================================================
#
# PURPOSE:
# Language-specific overrides that correct or extend the universal classification
# rules. The universal rules (derived from cross-language analysis of 27 grammars)
# handle ~80-90% of things correctly. This file covers the remaining language-
# specific items that the universal rules can't infer.
#
# CLASSIFICATION PIPELINE (priority order):
#   1. [overrides]    — This file. Highest priority. Wins unconditionally.
#   2. token_purpose  — Operators, keywords, literals, punctuation, comments.
#   3. universal_exact — Name matches unanimous classification across all languages.
#   4. universal_majority — Name matches >=75% agreement across languages.
#   5. category_map   — Grammar category -> SemanticClass mapping.
#   6. name_heuristic — Simple substring patterns (e.g., "comment" -> annotation).
#
# Override entries take precedence over ALL lower-priority rules, including
# universal_exact. This handles cases where a name means something different
# in this language than in most others (e.g., "method" = identifier in most
# languages, but definition_callable in Ruby).
#
# SEMANTIC CLASSES (22 values):
#   file_thing               — Root AST node (auto-detected, rarely overridden)
#   definition_callable      — Function/method definitions
#   definition_type          — Class/struct/interface/trait definitions
#   definition_data          — Variable/constant/parameter declarations
#   definition_test          — Test definitions
#   boundary_module          — Import/export/module declarations
#   boundary_error           — Error handling boundaries
#   boundary_resource        — Resource management boundaries
#   documentation_structured — Doc comments, structured documentation
#   flow_branching           — If/switch/match/case
#   flow_iteration           — For/while/loop
#   flow_control             — Break/continue/return/goto
#   flow_async               — Async/await/spawn
#   operation_invocation     — Function/method calls
#   operation_data           — Data access/manipulation
#   operation_operator       — Arithmetic, logical, comparison operators
#   expression_anonymous     — Lambdas, closures, anonymous functions
#   syntax_keyword           — Language keywords
#   syntax_identifier        — Variable/function names (references)
#   syntax_literal           — String/number/boolean literals
#   syntax_annotation        — Annotations, decorators, attributes, line comments
#   syntax_punctuation       — Brackets, delimiters, whitespace
#
# FORMAT:
# Each section is a TOML table. The key is the thing name (from node-types.json),
# the value is the SemanticClass.
#
# [overrides]
# thing_name = "semantic_class"
#
# [token_overrides]
# token_name = "semantic_class"     # Overrides token_purpose classification
#
# [doc_comment_tokens]
# token_name = true                 # Promotes comment token to documentation_structured
#
# =============================================================================
