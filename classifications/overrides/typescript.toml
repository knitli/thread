# Typescript language classification overrides
# Holdout evaluation: 96.0% overall → expected ~99% with overrides
# 13 items to override (6 unclassified + 7 misclassified)

[overrides]
# --- Tier 5: Syntax ---
assignment_pattern = "syntax_identifier"
class_body = "syntax_punctuation"
object_assignment_pattern = "syntax_identifier"
pair_pattern = "syntax_identifier"
sequence_expression = "syntax_identifier"
string = "syntax_keyword"  # category says operation_operator
variable_declaration = "syntax_identifier"  # category says definition_data
variable_declarator = "syntax_identifier"

[token_overrides]
# --- Tier 5: Syntax ---
"@" = "syntax_annotation"  # token_purpose says keyword
finally = "syntax_annotation"  # token_purpose says keyword
try = "syntax_annotation"  # token_purpose says keyword

[doc_comment_tokens]
comment = true
html_comment = true
