# C language classification overrides
# Holdout evaluation: 78.6% overall → expected ~99% with overrides
# 57 items to override (2 unclassified + 55 misclassified)

[overrides]
# --- Tier 1: Primary Definitions ---
type_definition = "definition_data"
# --- Tier 5: Syntax ---
attribute = "syntax_annotation"
macro_type_specifier = "syntax_annotation"  # category says definition_type

