# ! GitHub Action to run the CI pipeline for Thread
# ! Comprehensive CI with multi-platform testing, WASM builds, and security scanning
name: CI
on:
  push:
    branches:
      - main
      - develop
      - staging
      - 001-*
  pull_request:
    branches:
      - main
      - develop
      - staging
  workflow_dispatch:
permissions:
  contents: read
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
jobs:
  # Quick formatting and linting checks that fail fast
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt update && sudo apt install -y clang llvm-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --config-path ./rustfmt.toml --check
      - name: Run clippy
        # thread-language's napi-* features conflict with tree-sitter at runtime;
        # run it separately with only the compatible feature set.
        run: |
          cargo clippy --workspace --exclude thread-language --all-features --all-targets -- -D warnings
          cargo clippy -p thread-language --features all-parsers,matching --all-targets -- -D warnings
      - name: Check typos
        uses: crate-ci/typos@v1.16.23
  # Test matrix for multiple platforms and Rust versions
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        rust:
          - stable
        include:
          # Also test on beta and nightly on Linux
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests (nextest)
        # thread-language's napi-* features conflict with tree-sitter-parsing at runtime;
        # run it separately with only the compatible feature set.
        # On Linux and Windows, run all tests (Docker is available for testcontainers).
        if: runner.os != 'macOS'
        run: |
          cargo nextest run --workspace --exclude thread-language --all-features --no-fail-fast
          cargo nextest run -p thread-language --features all-parsers,matching --no-fail-fast
      - name: Run tests (nextest, macOS - skip Docker-dependent tests)
        # macOS GitHub Actions runners (Apple Silicon) do not have Docker,
        # so we exclude the incremental_postgres_tests that use testcontainers
        # to spin up Postgres containers.
        if: runner.os == 'macOS'
        run: |
          cargo nextest run --workspace --exclude thread-language --all-features --no-fail-fast \
            -E "not (package(thread-flow) and binary(incremental_postgres_tests))"
          cargo nextest run -p thread-language --features all-parsers,matching --no-fail-fast
      - name: Run doc tests
        run: |
          cargo test --doc --workspace --exclude thread-language --all-features
          cargo test --doc -p thread-language --features all-parsers,matching
  # Build and test WASM target for Edge deployment
  wasm:
    name: WASM Build & Test
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install clang for WASM C compilation
        run: sudo apt-get update -qq && sudo apt-get install -y clang
      - name: Set up C header stubs for wasm32-unknown-unknown
        # tree-sitter 0.25+ compiles C sources that #include standard C library headers
        # (stdio.h, stdlib.h, string.h, etc.). The wasm32-unknown-unknown target has no OS
        # and therefore no libc headers. We provide minimal stubs so the code compiles;
        # actual implementations (malloc, memcpy, etc.) come from the wasm runtime / Rust.
        run: |
          CLANG_RES=$(clang --print-resource-dir)
          STUBS=/tmp/wasm-stubs
          mkdir -p "$STUBS"

          # Use Python to write the stub files cleanly without heredoc indentation issues.
          python3 - << 'PYEOF'
import os
STUBS = '/tmp/wasm-stubs'
stubs = {}

stubs['stdio.h'] = """\
#pragma once
#include <stddef.h>
#include <stdarg.h>
typedef void FILE;
#define stderr ((FILE*)0)
#define stdout ((FILE*)0)
#define stdin  ((FILE*)0)
#define EOF    (-1)
static inline int fprintf(FILE *f, const char *fmt, ...) { (void)f; (void)fmt; return 0; }
static inline int vfprintf(FILE *f, const char *fmt, va_list ap) { (void)f; (void)fmt; (void)ap; return 0; }
static inline int printf(const char *fmt, ...) { (void)fmt; return 0; }
static inline int snprintf(char *s, size_t n, const char *fmt, ...) { (void)s; (void)n; (void)fmt; return 0; }
static inline int sprintf(char *s, const char *fmt, ...) { (void)s; (void)fmt; return 0; }
static inline int fputc(int c, FILE *f) { (void)f; return c; }
static inline int fputs(const char *s, FILE *f) { (void)s; (void)f; return 0; }
static inline int fflush(FILE *f) { (void)f; return 0; }
"""

stubs['stdlib.h'] = """\
#pragma once
#include <stddef.h>
#define EXIT_SUCCESS 0
#define EXIT_FAILURE 1
extern void *malloc(size_t size);
extern void *calloc(size_t count, size_t size);
extern void *realloc(void *ptr, size_t size);
extern void  free(void *ptr);
extern void  abort(void);
extern void  exit(int status);
static inline int abs(int x) { return x < 0 ? -x : x; }
"""

stubs['string.h'] = """\
#pragma once
#include <stddef.h>
extern void  *memcpy(void *dest, const void *src, size_t n);
extern void  *memmove(void *dest, const void *src, size_t n);
extern void  *memset(void *s, int c, size_t n);
extern int    memcmp(const void *s1, const void *s2, size_t n);
extern void  *memchr(const void *s, int c, size_t n);
extern size_t strlen(const char *s);
extern int    strcmp(const char *s1, const char *s2);
extern int    strncmp(const char *s1, const char *s2, size_t n);
extern char  *strcpy(char *dest, const char *src);
extern char  *strncpy(char *dest, const char *src, size_t n);
extern char  *strcat(char *dest, const char *src);
extern char  *strncat(char *dest, const char *src, size_t n);
extern char  *strchr(const char *s, int c);
extern char  *strrchr(const char *s, int c);
extern char  *strstr(const char *haystack, const char *needle);
"""

stubs['time.h'] = """\
#pragma once
#include <stdint.h>
typedef uint64_t time_t;
typedef uint64_t clock_t;
#define CLOCKS_PER_SEC ((clock_t)1000000)
static inline time_t time(time_t *t) { if (t) *t = 0; return 0; }
static inline clock_t clock(void) { return 0; }
"""

stubs['ctype.h'] = """\
#pragma once
static inline int isalpha(int c) { return (c>='a'&&c<='z')||(c>='A'&&c<='Z'); }
static inline int isdigit(int c) { return c>='0'&&c<='9'; }
static inline int isalnum(int c) { return isalpha(c)||isdigit(c); }
static inline int isspace(int c) { return c==' '||c=='\\t'||c=='\\n'||c=='\\r'||c=='\\f'||c=='\\v'; }
static inline int isupper(int c) { return c>='A'&&c<='Z'; }
static inline int islower(int c) { return c>='a'&&c<='z'; }
static inline int toupper(int c) { return islower(c)?c-('a'-'A'):c; }
static inline int tolower(int c) { return isupper(c)?c+('a'-'A'):c; }
static inline int isprint(int c) { return c>=' '&&c<='~'; }
static inline int iscntrl(int c) { return c<' '||c==127; }
static inline int isxdigit(int c) { return isdigit(c)||(c>='a'&&c<='f')||(c>='A'&&c<='F'); }
static inline int ispunct(int c) { return isprint(c)&&!isalnum(c)&&c!=' '; }
"""

stubs['wctype.h'] = """\
#pragma once
#include <stdint.h>
typedef uint32_t wint_t;
#define WEOF ((wint_t)-1)
static inline int     iswspace(wint_t c) { return c==' '||c=='\\t'||c=='\\n'||c=='\\r'||c=='\\f'||c=='\\v'; }
static inline int     iswalpha(wint_t c) { return (c>='a'&&c<='z')||(c>='A'&&c<='Z'); }
static inline int     iswdigit(wint_t c) { return c>='0'&&c<='9'; }
static inline int     iswalnum(wint_t c) { return iswalpha(c)||iswdigit(c); }
static inline int     iswupper(wint_t c) { return c>='A'&&c<='Z'; }
static inline int     iswlower(wint_t c) { return c>='a'&&c<='z'; }
static inline int     iswprint(wint_t c) { return c>=' '&&c<='~'; }
static inline int     iswpunct(wint_t c) { return iswprint(c)&&!iswalnum(c)&&c!=' '; }
static inline wint_t  towlower(wint_t c) { return iswupper(c)?c+('a'-'A'):c; }
static inline wint_t  towupper(wint_t c) { return iswlower(c)?c-('a'-'A'):c; }
"""

stubs['assert.h'] = """\
#pragma once
#define assert(x) ((void)(x))
"""

for name, content in stubs.items():
    path = os.path.join(STUBS, name)
    with open(path, 'w') as f:
        f.write(content)
    print(f'  wrote {path}')
PYEOF

          echo "CFLAGS_wasm32_unknown_unknown=-I${STUBS} -I${CLANG_RES}/include" >> "$GITHUB_ENV"
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build WASM (dev)
        run: cargo run -p xtask build-wasm
      - name: Build WASM (release)
        run: cargo run -p xtask build-wasm --release
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build-${{ github.sha }}
          path: |
            thread_wasm_bg.wasm
            thread_wasm.js
            thread_wasm.d.ts
          retention-days: 7
  # Performance benchmarks (only on main branch or manual trigger)
  benchmark:
    name: Benchmarks
    needs: quick-checks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run benchmarks
        run: cargo bench --workspace --no-fail-fast -- --output-format bencher | tee benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.txt
          retention-days: 30
  # Security audit with cargo-audit
  security_audit:
    name: Security Audit
    needs: quick-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run cargo-audit
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  # License compliance check with REUSE
  license:
    name: License Compliance
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v2
  # Code coverage (only on main or PRs to main)
  coverage:
    name: Code Coverage
    needs: quick-checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: |
          cargo llvm-cov --no-report --workspace --exclude thread-language --all-features
          cargo llvm-cov --no-report -p thread-language --features all-parsers,matching
          cargo llvm-cov --no-run --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  # Integration tests with Postgres (only on main or manual)
  integration:
    name: Integration Tests
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thread_test
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thread_test
        run: cargo nextest run --manifest-path crates/flow/Cargo.toml --all-features --test integration_tests --test d1_integration_test
  # Performance regression tests (on PRs and main)
  performance_regression:
    name: Performance Regression Tests
    needs: quick-checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run performance regression tests
        run: |
          cargo nextest run --manifest-path crates/flow/Cargo.toml \
            --all-features \
            --test performance_regression_tests \
            --no-capture
      - name: Check for regressions
        if: failure()
        run: |
          echo "⚠️ Performance regression detected!"
          echo "Review test output above for specific failures."
          exit 1
  # Load testing benchmarks (manual trigger or main branch only)
  load_testing:
    name: Load Testing Benchmarks
    needs: quick-checks
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run load test benchmarks
        run: |
          cargo bench --manifest-path crates/flow/Cargo.toml \
            --bench load_test \
            --all-features \
            -- --output-format bencher | tee load-test-results.txt
      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.sha }}
          path: load-test-results.txt
          retention-days: 90
      - name: Compare with baseline (if exists)
        continue-on-error: true
        run: "if [ -f .benchmark-baseline/load-test-baseline.txt ]; then\n  echo \"\U0001F4CA Comparing with baseline...\"\n  # Simple diff for now - could enhance with criterion-compare\n  diff .benchmark-baseline/load-test-baseline.txt load-test-results.txt || true\nelse\n  echo \"\U0001F4DD No baseline found - this will become the baseline\"\n  mkdir -p .benchmark-baseline\n  cp load-test-results.txt .benchmark-baseline/load-test-baseline.txt\nfi\n"
  # Final success check - all required jobs must pass
  ci-success:
    name: CI Success
    needs:
      - quick-checks
      - test
      - wasm
      - security_audit
      - license
      - performance_regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          # Treat both "success" and "skipped" as passing.
          # Jobs with `if:` conditions (e.g. performance_regression) report
          # "skipped" when their condition is false — that is not a failure.
          passed() { [[ "$1" == "success" || "$1" == "skipped" ]]; }

          ok=true
          for job in \
            "quick-checks=${{ needs.quick-checks.result }}" \
            "test=${{ needs.test.result }}" \
            "wasm=${{ needs.wasm.result }}" \
            "security_audit=${{ needs.security_audit.result }}" \
            "license=${{ needs.license.result }}" \
            "performance_regression=${{ needs.performance_regression.result }}"; do
            name="${job%%=*}"
            result="${job##*=}"
            if passed "$result"; then
              echo "✅ $name: $result"
            else
              echo "❌ $name: $result"
              ok=false
            fi
          done

          if [[ "$ok" != "true" ]]; then
            echo ""
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo ""
          echo "✅ All required jobs passed!"
