# ! GitHub Action for automated releases
# ! cargo smart-release drives versioning, changelogs, crates.io publishing, and tagging.
# ! Binary builds and GitHub release creation depend on the smart-release job output.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level (auto = detect from conventional commits per crate)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - keep
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: write
  packages: write
jobs:
  # Version, changelog, tag, and publish all crates via cargo smart-release
  smart-release:
    name: Version, Changelog & Publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - run: |
          sudo apt update && sudo apt install -y clang llvm-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-smart-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-smart-release
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run cargo smart-release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "${BUMP}" != "auto" ]; then
            cargo smart-release --execute --bump "${BUMP}" --update-crates-index --allow-fully-generated-changelogs \
              --changelog-without clippy --commit-prefix 'chore(release): ' --ignore-instability --dangerously-pass-no-verify --bump-dependencies patch
          else
            cargo smart-release --execute --update-crates-index --allow-fully-generated-changelogs \
              --changelog-without clippy --commit-prefix 'chore(release): ' --ignore-instability --dangerously-pass-no-verify --bump-dependencies patch
          fi
      - name: Get released version (thread CLI crate)
        id: get-version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "thread") | .version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
  # Generate SBOM and create the GitHub release using the version from smart-release
  create-release:
    name: Create GitHub Release
    needs: smart-release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      url: ${{ steps.create_release.outputs.url }}
    steps:
      - run: |
          sudo apt update && sudo apt install -y clang llvm-dev
      - uses: actions/checkout@v4
        with:
          ref: thread-v${{ needs.smart-release.outputs.version }}
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          experimental: true
          mise_toml: |
            [tools]
            "pipx:reuse" = "latest"
            python = "3.13"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reshim: true
      - name: Generate sbom
        id: sbom
        env:
          VERSION: ${{ needs.smart-release.outputs.version }}
        run: |
          mise x "pipx:reuse" -- reuse spdx --add-license-concluded --creator-organization "Knitli Inc." -o "sbom-${VERSION}.spdx"
          echo "sbom_path=sbom-${VERSION}.spdx" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thread-v${{ needs.smart-release.outputs.version }}
          name: Release ${{ needs.smart-release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.sbom.outputs.sbom_path }}
  # Build binaries for multiple platforms
  build-cli:
    name: Build (${{ matrix.target }})
    needs:
      - smart-release
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            strip: true
          # Linux x86_64 (musl for static linking)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            strip: true
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            strip: false
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            strip: true
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            strip: true
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            strip: false
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: thread-v${{ needs.smart-release.outputs.version }}
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          if [ "${USE_CROSS}" == "true" ]; then
              cross build --workspace --release --target "${TARGET}" --features parallel,caching
          else
              cargo build --workspace --release --target "${TARGET}" --features parallel,caching
          fi
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output "sbom-${TARGET}.json"
          cargo cyclonedx --format xml --output "sbom-${TARGET}.xml"
          cargo cyclonedx --all-dependencies --include-license-text --format json --output "sbom-complete-${TARGET}.json"
        shell: bash
      - name: Strip binary (if applicable)
        if: matrix.strip
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          strip "target/${TARGET}/release/thread${EXT}"
        shell: bash
      - name: Create archive
        id: archive
        env:
          VERSION: ${{ needs.smart-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          OS_TYPE: ${{ matrix.os }}
        run: |
          ARCHIVE_NAME="thread-${VERSION}-${TARGET}"
          if [ "${OS_TYPE}" == "windows-latest" ]; then
              7z a "${ARCHIVE_NAME}.zip" "./target/${TARGET}/release/thread.exe" "./sbom-${TARGET}.json" "./sbom-${TARGET}.xml" "./sbom-complete-${TARGET}.json"
              echo "asset_path=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
              echo "asset_content_type=application/zip" >> "$GITHUB_OUTPUT"
          else
              tar czf "${ARCHIVE_NAME}.tar.gz" -C "target/${TARGET}/release" thread -C "${GITHUB_WORKSPACE}" "sbom-${TARGET}.json" "sbom-${TARGET}.xml" "sbom-complete-${TARGET}.json"
              echo "asset_path=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
              echo "asset_content_type=application/gzip" >> "$GITHUB_OUTPUT"
          fi
          echo "asset_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.archive.outputs.asset_path }}
          asset_name: ${{ steps.archive.outputs.asset_name }}${{ matrix.os == 'windows-latest' && '.zip' || '.tar.gz' }}
          asset_content_type: ${{ steps.archive.outputs.asset_content_type }}
  # Release notification
  notify:
    name: Release Notification
    needs:
      - smart-release
      - build-cli
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check release status
        env:
          VERSION: ${{ needs.smart-release.outputs.version }}
          RESULT: ${{ needs.build-cli.result }}
        run: |
          echo "Release v${VERSION} completed"
          echo "Build result: ${RESULT}"
