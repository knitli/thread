# ! GitHub Action for automated releases
# ! Builds and publishes releases for multiple platforms
name: Release
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g., 0.1.0)
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
permissions:
  contents: write
  packages: write
jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.create_release.outputs.assets }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      url: ${{ steps.create_release.outputs.url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - run: |
          sudo apt update && sudo apt install -y clang llvm-dev
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${REF_NAME#refs/tags/v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          experimental: true
          mise_toml: |
            [tools]
            "pipx:reuse" = "latest"
            python = "3.13"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reshim: true
      - name: Generate sbom
        id: sbom
        run: |
          mise x "pipx:reuse" -- reuse spdx --add-license-concluded --creator-organization "Knitli Inc." -o "sbom-${{ steps.get_version.outputs.version }}.spdx"
          echo "sbom_path=sbom-${{ steps.get_version.outputs.version }}.spdx" >> "$GITHUB_OUTPUT"
          echo "sbom_content=$(cat sbom-${{ steps.get_version.outputs.version }}.spdx)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.sbom.outputs.sbom_path }}
  # Build binaries for multiple platforms
  build-cli:
    name: Build (${{ matrix.target }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            strip: true
          # Linux x86_64 (musl for static linking)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            strip: true
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            strip: false
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            strip: true
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            strip: true
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            strip: false
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.cross }}
        run: |
          if [ "${USE_CROSS}" == "true" ]; then
              cross build --workspace --release --target "${TARGET}" --features parallel,caching
          else
              cargo build --workspace --release --target "${TARGET}" --features parallel,caching
          fi
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output "sbom-${TARGET}.json"
          cargo cyclonedx --format xml --output "sbom-${TARGET}.xml"
          cargo cyclonedx --all-dependencies --include-license-text --format json --output "sbom-complete-${TARGET}.json"
        shell: bash
      - name: Strip binary (if applicable)
        if: matrix.strip
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          strip "target/${TARGET}/release/thread${EXT}"
        shell: bash
      - name: Create archive
        id: archive
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          OS_TYPE: ${{ matrix.os }}
        run: |
          ARCHIVE_NAME="thread-${VERSION}-${TARGET}"
          if [ "${OS_TYPE}" == "windows-latest" ]; then
              7z a "${ARCHIVE_NAME}.zip" "./target/${TARGET}/release/thread.exe ./sbom-${TARGET}.json ./sbom-${TARGET}.xml ./sbom-complete-${TARGET}.json"
              echo "asset_path=${ARCHIVE_NAME}.zip" >> "$GITHUB_OUTPUT"
              echo "asset_content_type=application/zip" >> "$GITHUB_OUTPUT"
          else
              tar czf "${ARCHIVE_NAME}.tar.gz" -C "target/${TARGET}/release" thread "./sbom-${TARGET}.json" "./sbom-${TARGET}.xml" "./sbom-complete-${TARGET}.json" thread
              echo "asset_path=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
              echo "asset_content_type=application/gzip" >> "$GITHUB_OUTPUT"
          fi
          echo "asset_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.archive.outputs.asset_path }}
          asset_name: ${{ steps.archive.outputs.asset_name }}${{ matrix.os == 'windows-latest' && '.zip' || '.tar.gz' }}
          asset_content_type: ${{ steps.archive.outputs.asset_content_type }}
  publish-crates:
    name: Publish to crates.io
    needs:
      - create-release
      - build-cli
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release publish --no-confirm
  # Release notification
  notify:
    name: Release Notification
    needs:
      - create-release
      - build-cli
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check release status
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          RESULT: ${{ needs.build-cli.result }}
        run: |
          echo "Release v${VERSION} completed"
          echo "Build result: ${RESULT}"
