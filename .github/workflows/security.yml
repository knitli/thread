# ! GitHub Action for comprehensive security scanning
# ! Runs on schedule, PRs, and manual triggers
name: Security Audit
on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: 0 2 * * *
  # Run on PRs to main
  pull_request:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
  # Run on push to main
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - '**/Cargo.toml'
  # Manual trigger
  workflow_dispatch:
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
permissions:
  contents: read
  issues: write
  security-events: write
jobs:
  # Vulnerability scanning with cargo-audit
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        id: audit
        run: |
          cargo audit --json > audit-results.json || true
          cat audit-results.json
      - name: Parse audit results
        id: parse
        run: |
          VULNERABILITIES="$(jq '.vulnerabilities.count' audit-results.json)"
          echo "vulnerabilities=${VULNERABILITIES}" >> "$GITHUB_OUTPUT"

          if [ "${VULNERABILITIES}" -gt 0 ]; then
            echo "::warning::Found ${VULNERABILITIES} vulnerabilities"
            jq -r '.vulnerabilities.list[] | "::warning file=Cargo.toml,title=\(.advisory.id)::\(.advisory.title) in \(.package.name) \(.package.version)"' audit-results.json
          fi
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-audit-results
          path: audit-results.json
          retention-days: 30
      - name: Create issue for vulnerabilities
        if: steps.parse.outputs.vulnerabilities != '0' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));

            if (audit.vulnerabilities.count === 0) return;

            const vulns = audit.vulnerabilities.list.map(v => {
            return `### ${v.advisory.id}: ${v.advisory.title}

            **Package**: \`${v.package.name}@${v.package.version}\`
            **Severity**: ${v.advisory.metadata?.severity || 'Unknown'}
            **URL**: ${v.advisory.url}

            ${v.advisory.description}

            **Patched Versions**: ${v.versions.patched.join(', ') || 'None'}
            `;
            }).join('\n\n---\n\n');

            const title = `Security: ${audit.vulnerabilities.count} vulnerabilities found`;
            const body = `## Security Audit Report

            **Date**: ${new Date().toISOString()}
            **Vulnerabilities**: ${audit.vulnerabilities.count}

            ${vulns}

            ---

            This issue was automatically created by the security audit workflow.`;

            await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['security', 'dependencies']
            });
  # Dependency review for PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
  # SAST scanning with Semgrep
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/rust p/security-audit p/secrets
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
  # Supply chain security with cargo-deny
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check advisories
        run: cargo deny check advisories
      - name: Check licenses
        run: cargo deny check licenses
      - name: Check bans
        run: cargo deny check bans
      - name: Check sources
        run: cargo deny check sources
        # Outdated dependency check
  outdated:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked
      - name: Check for outdated dependencies
        id: outdated
        run: |
          cargo outdated --format json > outdated.json || true

          OUTDATED_COUNT="$(jq '[.dependencies[] | select(.latest != .project)] | length' outdated.json)"
          echo "outdated=${OUTDATED_COUNT}" >> "$GITHUB_OUTPUT"
      - name: Upload outdated report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outdated-dependencies
          path: outdated.json
          retention-days: 30
      - name: Create issue for outdated dependencies
        if: steps.outdated.outputs.outdated != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outdated = JSON.parse(fs.readFileSync('outdated.json', 'utf8'));

            const deps = outdated.dependencies
            .filter(d => d.latest !== d.project)
            .map(d => `- \`${d.name}\`: ${d.project} → ${d.latest}`)
            .join('\n');

            if (!deps) return;

            const title = `Dependencies: ${outdated.dependencies.length} packages outdated`;
            const body = `## Outdated Dependencies Report

            **Date**: ${new Date().toISOString()}

            The following dependencies have newer versions available:

            ${deps}

            ---

            This issue was automatically created by the security audit workflow.
            Consider updating these dependencies and running tests.`;

            await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['dependencies', 'maintenance']
            });
  # Security policy validation
  security-policy:
    name: Security Policy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SECURITY.md exists
        run: |
          if [ ! -f "SECURITY.md" ]; then
          echo "::error::SECURITY.md file not found"
          exit 1
          fi
      - name: Validate security policy
        run: |
          # Check for required sections
          for section in "Supported Versions" "Reporting" "Disclosure"; do
          if ! grep -qi "$section" SECURITY.md; then
          echo "::warning::SECURITY.md missing section: $section"
          fi
          done
  # Summary report
  security-summary:
    name: Security Summary
    needs:
      - cargo-audit
      - cargo-deny
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          {
            echo "## Security Audit Summary"
            echo ""
            echo "**Date**: \"$(date -u +"%Y-%m-%d %H:%M:%S UTC")\""
            echo ""
            echo "### Job Results"
            echo ""
            echo "- Cargo Audit: ${{ needs.cargo-audit.result }}"
            echo "- Cargo Deny: ${{ needs.cargo-deny.result }}"
            echo ""

            if [ "${{ needs.cargo-audit.result }}" == "success" ] && \
            [ "${{ needs.cargo-deny.result }}" == "success" ]; then
            echo "✅ **All security checks passed**"
            else
            echo "❌ **Some security checks failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
