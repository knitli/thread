# GitLab CI Deployment Pipeline
# Production deployment with multiple strategies

stages:
  - validate
  - build
  - deploy
  - verify

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"

# Pre-deployment validation
validate:tests:
  stage: validate
  image: rust:latest
  script:
    - cargo nextest run --all-features --no-fail-fast
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/
  only:
    - main
    - /^release\/.*$/

validate:security:
  stage: validate
  image: rust:latest
  script:
    - cargo audit
    - cargo clippy -- -D warnings
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
  only:
    - main
    - /^release\/.*$/

validate:benchmarks:
  stage: validate
  image: rust:latest
  script:
    - cargo bench --bench fingerprint_benchmark -- --test
    - cargo bench --bench load_test -- --test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/
  only:
    - main

# Build release artifacts
build:release:
  stage: build
  image: rust:latest
  script:
    - cargo build --release --all-features
    - cp target/release/thread-cli thread-cli-${CI_COMMIT_SHA}
  artifacts:
    paths:
      - thread-cli-${CI_COMMIT_SHA}
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/
  only:
    - main
    - /^release\/.*$/

build:wasm:
  stage: build
  image: rust:latest
  before_script:
    - rustup target add wasm32-unknown-unknown
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - npm install -g wrangler
  script:
    - cargo run -p xtask build-wasm --release
  artifacts:
    paths:
      - crates/wasm/pkg/
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - target/
  only:
    - main

# Blue-Green Deployment
deploy:blue-green:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Green environment..."
    - |
      kubectl set image deployment/thread-worker-green \
        thread=thread:${CI_COMMIT_SHA} \
        --namespace=production
    - |
      kubectl rollout status deployment/thread-worker-green \
        --namespace=production \
        --timeout=10m
    - echo "Running smoke tests on Green..."
    - ./scripts/smoke-test.sh https://green.thread.internal
    - echo "Switching traffic to Green..."
    - |
      kubectl patch service thread-service \
        --namespace=production \
        -p '{"spec":{"selector":{"version":"green"}}}'
    - echo "Monitoring Green environment..."
    - sleep 300
    - ./scripts/check-metrics.sh
  environment:
    name: production
    url: https://thread.example.com
    on_stop: rollback:blue-green
  only:
    - main
  when: manual

rollback:blue-green:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Rolling back to Blue environment..."
    - |
      kubectl patch service thread-service \
        --namespace=production \
        -p '{"spec":{"selector":{"version":"blue"}}}'
  environment:
    name: production
    action: stop
  when: manual

# Canary Deployment
deploy:canary:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Starting canary deployment..."
    - |
      kubectl set image deployment/thread-worker-canary \
        thread=thread:${CI_COMMIT_SHA} \
        --namespace=production
    - |
      for weight in 5 10 25 50 75 100; do
        echo "Canary at ${weight}%..."
        kubectl patch virtualservice thread-canary \
          --namespace=production \
          --type merge \
          -p "{\"spec\":{\"http\":[{\"route\":[
            {\"destination\":{\"host\":\"thread-service\",\"subset\":\"stable\"},\"weight\":$((100-weight))},
            {\"destination\":{\"host\":\"thread-service\",\"subset\":\"canary\"},\"weight\":${weight}}
          ]}]}}"
        sleep 300
        ./scripts/check-metrics.sh canary
      done
    - echo "Promoting canary to stable..."
    - |
      kubectl set image deployment/thread-worker-stable \
        thread=thread:${CI_COMMIT_SHA} \
        --namespace=production
  environment:
    name: production-canary
    url: https://thread.example.com
  only:
    - main
  when: manual

# Rolling Deployment
deploy:rolling:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Starting rolling deployment..."
    - |
      kubectl set image deployment/thread-worker \
        thread=thread:${CI_COMMIT_SHA} \
        --namespace=production
    - |
      kubectl rollout status deployment/thread-worker \
        --namespace=production \
        --timeout=15m
  environment:
    name: production-rolling
    url: https://thread.example.com
  only:
    - main
  when: manual

# Edge Deployment (Cloudflare Workers)
deploy:edge:
  stage: deploy
  image: node:20
  dependencies:
    - build:wasm
  before_script:
    - npm install -g wrangler
  script:
    - echo "Deploying to Cloudflare Workers..."
    - wrangler deploy --env production
    - sleep 10
    - ./scripts/smoke-test.sh https://thread.example.com
  environment:
    name: edge-production
    url: https://thread.example.com
  only:
    - main
  when: manual

# Post-deployment verification
verify:smoke-tests:
  stage: verify
  image: curlimages/curl:latest
  script:
    - echo "Running comprehensive smoke tests..."
    - ./scripts/smoke-test.sh https://thread.example.com
  dependencies: []
  only:
    - main

verify:slos:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bc
  script:
    - echo "Validating SLO compliance..."
    - ./scripts/validate-slos.sh
  dependencies: []
  only:
    - main

verify:metrics:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bc
  script:
    - echo "Monitoring production metrics for 30 minutes..."
    - |
      for i in $(seq 1 30); do
        echo "Minute $i/30..."
        ./scripts/check-metrics.sh
        sleep 60
      done
  dependencies: []
  only:
    - main
