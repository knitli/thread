[package]
name = "thread-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Thread code analysis for Cloudflare Workers edge deployment"
license = "PROPRIETARY"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Thread crates
thread-flow = { path = ".." }
thread-ast-engine = { workspace = true }
thread-language = { workspace = true }
thread-services = { workspace = true }

# Cloudflare Workers runtime
worker = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Async runtime (edge-compatible)
tokio = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging (Workers-compatible)
console_error_panic_hook = "0.1"
console_log = { version = "1.0", features = ["color"] }
log = "0.4"

[profile.release]
opt-level = "z"       # Optimize for size (critical for WASM)
lto = "fat"           # Link-time optimization
codegen-units = 1     # Single compilation unit for better optimization
strip = true          # Strip symbols to reduce size
panic = "abort"       # Smaller panic handler

[profile.wasm-release]
inherits = "release"
opt-level = "s"       # Size optimization for WASM
