name = "thread-analysis-worker"
main = "src/lib.rs"
compatibility_date = "2026-01-27"
workers_dev = true

# Build configuration
[build]
command = "cargo install -q worker-build && worker-build --release"

# D1 Database bindings
# Note: Create database first with: wrangler d1 create thread-analysis
[[d1_databases]]
binding = "DB"
database_name = "thread-analysis"
database_id = "" # Set this after creating D1 database

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "development"

# Staging environment
[env.staging]
name = "thread-analysis-worker-staging"
vars = { ENVIRONMENT = "staging" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "thread-analysis-staging"
database_id = "" # Set this after creating staging D1 database

# Production environment
[env.production]
name = "thread-analysis-worker-prod"
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "thread-analysis-prod"
database_id = "" # Set this after creating production D1 database

# Resource limits
[limits]
# CPU time limit per request (ms)
cpu_ms = 50

# Secrets (set via: wrangler secret put D1_API_TOKEN)
# - D1_API_TOKEN: Cloudflare API token for D1 access
# - D1_ACCOUNT_ID: Cloudflare account ID
# - D1_DATABASE_ID: D1 database ID
